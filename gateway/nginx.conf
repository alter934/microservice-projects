events { worker_connections 1024; }

http {
    # Gelen isteklerin log formatı
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"http_user_agent"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 8000;

        # 📦 /api/urunler isteklerini doğrudan urun-servisi'ne yönlendirir
        location /api/urunler {
            proxy_pass http://urun-servisi:5001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 📦 /api/stoklar isteklerini doğrudan stok-servisi'ne yönlendirir
        location /api/stoklar {
            proxy_pass http://stok-servisi:5002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Opsiyonel: Sağlık kontrolü (Health Check) ucu
        location /health {
            return 200 'API Gateway Ayakta! 🚀\n';
            add_header Content-Type text/plain;
        }
    }
}